name: Check site availability
description: Verify that a URL is available, optionally requiring the response body to include expected text.

branding:
  icon: activity
  color: green

inputs:
  url:
    description: Full URL to request.
    required: true
  expected-text:
    description: Optional text fragment that must appear in the response body. Omit to check that a GET request returns content.
    required: false

runs:
  using: composite
  steps:
    - name: Check URL availability
      shell: bash
      env:
        INPUT_URL: ${{ inputs.url }}
        INPUT_EXPECTED_TEXT: ${{ inputs.expected-text }}
      run: |
        set -euo pipefail

        if [ -z "$INPUT_URL" ]; then
          echo "::error title=Site monitoring configuration error::The 'url' input is required."
          {
            echo "## Site monitoring failed"
            echo "- Reason: Missing required action input."
            echo "- URL: \`${INPUT_URL:-<empty>}\`"
          } >> "$GITHUB_STEP_SUMMARY"
          exit 1
        fi

        echo "Checking $INPUT_URL"

        if [ -z "$INPUT_EXPECTED_TEXT" ]; then
          probe_dir="$(mktemp -d "${RUNNER_TEMP:?}/site-probe.XXXXXX")"
          trap 'rm -rf -- "$probe_dir"' EXIT
          prefix_limit=1024

          # Write metadata to stderr separately from the binary body. Silence curl's
          # diagnostics so this file contains only the final HTTP status.
          # Capture both pipeline statuses before any other command overwrites them.
          if curl -fsL --retry 3 --max-time 30 --range 0-1023 \
            --write-out '%{stderr}%{http_code}\n' "$INPUT_URL" 2>"$probe_dir/status" \
            | head -c "$prefix_limit" >"$probe_dir/body"; then
            probe_statuses=("${PIPESTATUS[@]}")
          else
            probe_statuses=("${PIPESTATUS[@]}")
          fi

          http_status="$(cat "$probe_dir/status")"
          bytes_received="$(wc -c <"$probe_dir/body")"
          curl_status="${probe_statuses[0]}"
          reader_status="${probe_statuses[1]}"
          reason=""

          if [[ ! "$http_status" =~ ^2[0-9][0-9]$ ]]; then
            reason="The GET request did not return a successful HTTP response."
          elif [ "$reader_status" -ne 0 ]; then
            reason="Could not save the response prefix."
          elif [ "$bytes_received" -eq 0 ]; then
            reason="The GET response contained no content."
          elif [ "$curl_status" -ne 0 ]; then
            # A full prefix can close the pipe before curl finishes when Range
            # is ignored. Accept only that intentional write error.
            if [ "$curl_status" -ne 23 ] || [ "$bytes_received" -ne "$prefix_limit" ]; then
              reason="The GET transfer failed before the response prefix was complete."
            fi
          fi

          if [ -z "$reason" ]; then
            echo "Availability check passed for $INPUT_URL using GET (HTTP $http_status, $bytes_received bytes received)"
            exit 0
          fi

          echo "::error title=Site monitoring failed::Availability check failed for $INPUT_URL."
          {
            echo "## Site monitoring failed"
            echo "- URL: [$INPUT_URL]($INPUT_URL)"
            echo "- Reason: $reason"
            echo "- HTTP status: ${http_status:-unavailable}"
            echo "- Curl exit code: $curl_status"
            echo "- Prefix reader exit code: $reader_status"
            echo "- Bytes received: $bytes_received"
          } >> "$GITHUB_STEP_SUMMARY"
          exit 1
        fi

        if ! response_body="$(curl -fsSL --retry 3 --max-time 30 "$INPUT_URL")"; then
          echo "::error title=Site monitoring failed::Request failed for $INPUT_URL."
          {
            echo "## Site monitoring failed"
            echo "- URL: [$INPUT_URL]($INPUT_URL)"
            echo "- Reason: The HTTP request failed."
          } >> "$GITHUB_STEP_SUMMARY"
          exit 1
        fi

        if ! grep -Fq -- "$INPUT_EXPECTED_TEXT" <<<"$response_body"; then
          echo "::error title=Site monitoring failed::Expected text was not found at $INPUT_URL."
          response_body_preview_limit=4000
          response_body_size="${#response_body}"
          response_body_preview="${response_body:0:response_body_preview_limit}"
          response_body_preview_size="${#response_body_preview}"

          echo "::group::Response body preview"
          printf '%s\n' "$response_body_preview"
          if [ "$response_body_size" -gt "$response_body_preview_size" ]; then
            echo
            echo "[truncated ${response_body_preview_size}/${response_body_size} characters]"
          fi
          echo "::endgroup::"

          {
            echo "## Site monitoring failed"
            echo "- URL: [$INPUT_URL]($INPUT_URL)"
            echo "- Missing text: \`$INPUT_EXPECTED_TEXT\`"
            echo "- Response body preview: Logged to the workflow console"
          } >> "$GITHUB_STEP_SUMMARY"
          exit 1
        fi

        echo "Site check passed for $INPUT_URL"
